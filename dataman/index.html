<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #f5f3ef;
    --surface:   #fdfdfc;
    --border:    #e4e1dc;
    --text:      #1c1c1e;
    --text-muted:#787880;
    --accent:    #3b4cc0;
    --accent-dim:#2f3da0;
    --radius:    8px;
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 60px 24px 32px;
  }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 56px;
  }

  .logo {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .logo span {
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    color: var(--accent);
    font-weight: 500;
  }

  .status {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* ===== hero ===== */
  .hero {
    margin-bottom: 48px;
  }

  .hero h1 {
    font-size: 52px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.03em;
    margin-bottom: 14px;
    line-height: 1.08;
  }

  .hero h1 .mono {
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    font-size: 44px;
    color: var(--accent);
    font-weight: 550;
  }

  .hero .desc {
    font-size: 16px;
    color: var(--text-muted);
    max-width: 460px;
    line-height: 1.6;
  }

  /* ===== chat 卡片 ===== */
  .chat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0;
    overflow: hidden;
    margin-bottom: 48px;
    box-shadow: 0 1px 4px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }

  .chat-body {
    padding: 0;
  }

  .chat-window {
    padding: 20px 22px 16px;
    min-height: 130px;
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--surface);
  }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.55;
    word-break: break-word;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
  }

  .msg .meta {
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    font-size: 10.5px;
    opacity: .5;
    margin-top: 5px;
    text-align: right;
  }

  .quick-qs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 22px;
    border-top: 1px solid var(--border);
  }

  .quick-q {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all .18s;
    font-family: inherit;
  }

  .quick-q:hover {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--accent);
  }

  .input-row {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--border);
  }

  .input-row input {
    flex: 1;
    border: none;
    padding: 15px 22px;
    font-size: 14px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    font-family: inherit;
  }

  .input-row input::placeholder {
    color: #b8b8c4;
    font-size: 14px;
  }

  .input-row button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 15px 28px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: .01em;
    transition: background .2s;
  }

  .input-row button:hover { background: var(--accent-dim); }

  /* ===== footer ===== */
  .footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer .copy {
    font-size: 12px;
    color: #aaa;
  }

  .footer .links {
    display: flex;
    gap: 20px;
    font-size: 13px;
  }

  .footer .links a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color .2s;
  }

  .footer .links a:hover { color: var(--accent); }

  /* ===== 响应式 ===== */
  @media (max-width: 560px) {
    .container { padding: 36px 18px 24px; }
    .hero { margin-bottom: 36px; }
    .hero h1 { font-size: 36px; }
    .hero h1 .mono { font-size: 30px; }
    .chat-card { margin-bottom: 32px; }
    .msg { max-width: 88%; }
    .input-row button { padding: 15px 18px; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- ========== 顶栏 ========== -->
  <header class="topbar">
    <div class="logo"><span>~/v</span></div>
    <div class="status">open to messages</div>
  </header>

  <!-- ========== hero ========== -->
  <section class="hero">
    <h1>Hi, I'm <span class="mono">v</span></h1>
    <p class="desc">ERP 客服 · 正在转向 AI 应用，关注大模型如何给传统企业业务带来真实价值。</p>
  </section>

  <!-- ========== 对话 ========== -->
  <div class="chat-card">
    <div class="chat-body">
      <div class="chat-window" id="chatWindow">
        <div class="msg bot">
          我是 v 的 AI 助手，有什么想了解的可以问我。
          <div class="meta">just now</div>
        </div>
      </div>

      <div class="quick-qs">
        <button class="quick-q" data-q="你是谁？">你是谁？</button>
        <button class="quick-q" data-q="你擅长什么？">你擅长什么？</button>
        <button class="quick-q" data-q="最近在忙什么？">最近在忙什么？</button>
        <button class="quick-q" data-q="怎么联系你？">怎么联系你？</button>
      </div>

      <div class="input-row">
        <input type="text" id="chatInput" placeholder="$ type something…" maxlength="200">
        <button id="sendBtn">↵ send</button>
      </div>
    </div>
  </div>

  <!-- ========== footer ========== -->
  <footer class="footer">
    <span class="copy">v &copy; 2026</span>
    <div class="links">
      <a href="mailto:v@example.com">Email</a>
      <a href="#">GitHub</a>
      <a href="#">WeChat</a>
    </div>
  </footer>

</div>

<script>
  const knowledge = {
    default: [
      "这个问题我暂时还不太会回答，试试快捷提问吧。",
      "知识库还没覆盖到这块，过段时间再来问我？",
    ],
    "职业": [
      "现在做 ERP 客服，每天跟企业系统和客户打交道。对 ERP、CRM 这块比较熟。",
    ],
    "忙什么": [
      "最近在学 AI，想跟自己的 ERP / CRM 经验结合，做出能落地的商业 AI 项目。方向是智能客服、自动化报表、流程优化。",
    ],
    "作品": [
      "目前还在搭建阶段，这个主页就是其中一个。后续会把 AI × 企业服务的 prototype 放上来。",
    ],
    "联系": [
      "可以发邮件到 v@example.com，或者直接在聊天区留言，我会看到的。",
    ],
    "你是谁": [
      "我是 v 的 AI 助手。v 做 ERP 客服，擅长 ERP 和 CRM。最近在学 AI，想把 AI 和传统企业业务结合。爱好登山、游戏、AI。特点：逻辑强，嘴硬。",
    ],
    "擅长": [
      "擅长 ERP 和 CRM 系统。关注 AI 给传统企业赋能——大模型做智能客服、自动化流程、数据分析报表。",
    ],
    "兴趣": [
      "登山、游戏、AI 应用。户外+宅家+代码三线切换。",
    ],
    "特点": [
      "逻辑思维强，立场坚定。朋友说叫嘴硬，我说叫思辨。",
    ],
  };

  function matchAnswer(input) {
    const q = input.toLowerCase();
    if (/职业|身份|做.*什么|是做/.test(q)) return knowledge["职业"];
    if (/最近|在干嘛|忙|现在干嘛/.test(q)) return knowledge["忙什么"];
    if (/作品|项目|成果/.test(q)) return knowledge["作品"];
    if (/联系|找到|微信|邮箱/.test(q)) return knowledge["联系"];
    if (/谁|你是|分身/.test(q)) return knowledge["你是谁"];
    if (/擅长|会|能力|方向/.test(q)) return knowledge["擅长"];
    if (/兴趣|爱好|喜欢/.test(q)) return knowledge["兴趣"];
    if (/特点|性格|狡辩|嘴硬/.test(q)) return knowledge["特点"];
    return null;
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function addMessage(text, type) {
    const t = new Date();
    const time = t.getHours().toString().padStart(2,"0") + ":" + t.getMinutes().toString().padStart(2,"0");
    const html = `<div class="msg ${type}">${text}<div class="meta">${time}</div></div>`;
    chatWindow.insertAdjacentHTML("beforeend", html);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function sendMessage(input) {
    const text = input.trim();
    if (!text) return;
    addMessage(text, "user");
    setTimeout(() => {
      const answers = matchAnswer(text);
      addMessage(answers ? pick(answers) : pick(knowledge.default), "bot");
    }, 500 + Math.random() * 600);
  }

  const chatWindow = document.getElementById("chatWindow");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");

  sendBtn.addEventListener("click", () => { sendMessage(chatInput.value); chatInput.value = ""; });
  chatInput.addEventListener("keydown", e => { if (e.key === "Enter") { sendMessage(chatInput.value); chatInput.value = ""; } });
  document.querySelectorAll(".quick-q").forEach(b => b.addEventListener("click", () => sendMessage(b.dataset.q)));
</script>

</body>
</html>
